# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:reservvo-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256
jwt.expiration=86400000

# Redis desabilitado
redis.streams.enabled=false
spring.data.redis.repositories.enabled=false

# Desabilita health checks e actuator completamente
management.health.redis.enabled=false
management.health.defaults.enabled=false
management.endpoints.enabled-by-default=false

# AWS placeholder
aws.region=sa-east-1
aws.ses.from=test@test.com
aws.ses.from-name=Test
aws.access-key-id=test
aws.secret-access-key=test

# Permite override de beans
spring.main.allow-bean-definition-overriding=true

# Desabilita autoconfigurações desnecessárias
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration